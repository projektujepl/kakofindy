<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moje IP</title>
  <style>
    /* Reset i centrowanie */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0b1120, #19233e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 3.5rem;
      padding: 3rem 4rem;
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03);
      text-align: center;
      transition: transform 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .card:hover {
      transform: scale(1.01);
    }

    .ip-label {
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 0.75rem;
      font-weight: 500;
      opacity: 0.8;
    }

    .ip-address {
      font-size: 4.5rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.02em;
      text-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
      word-break: break-word;
      line-height: 1.2;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    }

    .loading-placeholder {
      color: #cbd5e1;
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .refresh-hint {
      margin-top: 2.2rem;
      color: #64748b;
      font-size: 0.9rem;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      padding-top: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .refresh-hint svg {
      opacity: 0.6;
    }

    /* małe ekrany */
    @media (max-width: 600px) {
      .card {
        padding: 2.5rem 1.8rem;
        border-radius: 2.5rem;
        width: 100%;
      }
      .ip-address {
        font-size: 2.8rem;
      }
      .loading-placeholder {
        font-size: 2rem;
      }
    }

    /* ciemny motyw z nutką błękitu */
    .glow {
      position: relative;
    }

    .glow::after {
      content: '';
      position: absolute;
      inset: -0.5rem;
      border-radius: 4rem;
      background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.08), transparent 70%);
      z-index: -1;
      filter: blur(16px);
    }
  </style>
</head>
<body>

<div class="card glow">
  <div class="ip-label">🌐 Twoje publiczne IP</div>
  
  <!-- Tu wstawiamy adres IP lub informację o ładowaniu -->
  <div id="ipDisplay" class="ip-address loading-placeholder">
    ⏳ pobieranie...
  </div>

  <div class="refresh-hint">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9h-4m-9 9a9 9 0 01-9-9m9 9v-4m-9-9a9 9 0 019-9m-9 9h4" />
    </svg>
    <span>odśwież stronę, aby sprawdzić ponownie</span>
  </div>
</div>

<script>
  (function getAndShowIP() {
    const displayElement = document.getElementById('ipDisplay');
    
    // Jeśli przeglądarka nie wspiera fetch, użyjemy starszego XMLHttpRequest jako fallback
    if (!window.fetch) {
      // fallback dla bardzo starych przeglądarek (ale rzadkość)
      const xhr = new XMLHttpRequest();
      xhr.open('GET', 'https://api.ipify.org?format=json');
      xhr.onload = function() {
        if (xhr.status === 200) {
          try {
            const data = JSON.parse(xhr.responseText);
            displayElement.textContent = data.ip;
            displayElement.classList.remove('loading-placeholder');
          } catch (e) {
            displayElement.textContent = '❌ błąd';
          }
        } else {
          displayElement.textContent = '❌ błąd';
        }
      };
      xhr.onerror = function() {
        displayElement.textContent = '❌ błąd połączenia';
      };
      xhr.send();
      return;
    }

    // Główny fetch do ipify (obsługuje IPv4 i IPv6)
    fetch('https://api.ipify.org?format=json')
      .then(response => {
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        return response.json();
      })
      .then(data => {
        if (data && data.ip) {
          displayElement.textContent = data.ip;
          displayElement.classList.remove('loading-placeholder');
        } else {
          throw new Error('Brak IP w odpowiedzi');
        }
      })
      .catch(error => {
        // jeśli ipify zawiedzie, próbujemy alternatywne API (ip-api)
        console.warn('ipify nie działa, próbuję ip-api...', error);
        fetch('https://ipapi.co/json/')
          .then(res => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
          })
          .then(data => {
            if (data && data.ip) {
              displayElement.textContent = data.ip;
              displayElement.classList.remove('loading-placeholder');
            } else {
              throw new Error('Brak IP w odpowiedzi ip-api');
            }
          })
          .catch(secondError => {
            console.error('Oba API nie zadziałały:', secondError);
            displayElement.textContent = '🌐 nie udało się pobrać';
            displayElement.classList.remove('loading-placeholder');
          });
      });
  })();
</script>

</body>
</html>
