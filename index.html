<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promki UsFans / KakoBuy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      padding: 1.5rem;
    }

    .container {
      text-align: center;
    }

    /* Przycisk */
    .check-btn {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      color: white;
      font-size: 1.5rem;
      font-weight: 600;
      padding: 1.2rem 3.5rem;
      border-radius: 4rem;
      cursor: pointer;
      box-shadow: 0 8px 30px -6px rgba(79, 70, 229, 0.5);
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
    }

    .check-btn:hover {
      transform: scale(1.04);
      background: linear-gradient(135deg, #818cf8, #4f46e5);
      box-shadow: 0 12px 40px -8px #4f46e5;
    }

    .check-btn:active {
      transform: scale(0.96);
    }

    .check-btn:disabled {
      opacity: 0.6;
      transform: scale(0.98);
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Wynik IP */
    .ip-result {
      margin-top: 2.5rem;
      min-height: 4rem;
      font-size: 3.2rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 30px rgba(99, 102, 241, 0.2);
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      letter-spacing: 0.02em;
      word-break: break-word;
      transition: all 0.3s ease;
    }

    .ip-result.placeholder {
      color: #64748b;
      font-weight: 400;
      font-size: 1.1rem;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      opacity: 0.6;
    }

    .ip-result.error {
      color: #f87171;
      font-size: 1.3rem;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      font-weight: 500;
    }

    /* Spinner w przycisku */
    .spinner {
      display: inline-block;
      width: 1.2rem;
      height: 1.2rem;
      border: 2.5px solid rgba(255,255,255,0.25);
      border-top: 2.5px solid white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Fade-in dla wyniku */
    .fade-in {
      animation: fadeUp 0.35s ease forwards;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- TYLKO PRZYCISK -->
  <button id="checkBtn" class="check-btn">
    <span>🔍</span> Promki UsFans / KakoBuy
  </button>

  <!-- Wynik pojawia się poniżej -->
  <div id="ipDisplay" class="ip-result placeholder">
    kliknij przycisk
  </div>
</div>

<script>
  (function() {
    const btn = document.getElementById('checkBtn');
    const display = document.getElementById('ipDisplay');
    let loading = false;

    function setLoading(state) {
      loading = state;
      if (state) {
        btn.disabled = true;
        btn.innerHTML = `
          <span>⏳</span> Sprawdzam
          <span class="spinner"></span>
        `;
      } else {
        btn.disabled = false;
        btn.innerHTML = `
          <span>🔍</span> Sprawdź IP
        `;
      }
    }

    function showIP(ip) {
      display.className = 'ip-result fade-in';
      display.textContent = ip;
    }

    function showError(msg) {
      display.className = 'ip-result error fade-in';
      display.textContent = `⚠️ ${msg}`;
    }

    function fetchIP() {
      if (loading) return;

      setLoading(true);
      display.className = 'ip-result placeholder';
      display.textContent = '⏳ pobieranie...';

      fetch('https://api.ipify.org?format=json')
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then(data => {
          if (data && data.ip) {
            showIP(data.ip);
          } else {
            throw new Error('Brak IP');
          }
        })
        .catch(err => {
          console.warn('ipify błąd, próbuję ip-api...', err);
          return fetch('https://ipapi.co/json/')
            .then(res => {
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              return res.json();
            })
            .then(data => {
              if (data && data.ip) {
                showIP(data.ip);
              } else {
                throw new Error('Brak IP');
              }
            })
            .catch(() => {
              showError('Nie udało się pobrać IP');
            });
        })
        .finally(() => {
          setLoading(false);
        });
    }

    btn.addEventListener('click', fetchIP);
  })();
</script>

</body>
</html>
